[project]
name = "meal-planner"
version = "0.1.0"
description = "Plans the week's dinners around the household calendar, local grocery deals and what you like, then writes the shopping list to Google Keep."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "keyring>=25",
    "gkeepapi>=0.17.1",
    "mcp>=2.0",
]

[project.scripts]
meals = "meals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meals"]

[[tool.mypy.overrides]]
module = ["recurring_ical_events", "keyring", "gkeepapi", "gkeepapi.*", "icalendar"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
